# Publish the results site to GitHub Pages: the files built by scripts/build_site.py (site/) with the Astro pages (web/, built
# here from site_data/; docs/49) at the root and the previous single page at /classic/. If the Astro build fails, the
# previous single page is published at the root as before.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'site_data/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the Astro site and its search index
        id: astro
        continue-on-error: true
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Assemble (new site at the root, previous page at /classic/)
        if: steps.astro.outcome == 'success'
        run: node web/scripts/assemble.mjs site web/dist
      - name: Report a failed Astro build
        if: steps.astro.outcome == 'failure'
        run: echo "::warning::Astro build failed; publishing the previous single page at the root."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
