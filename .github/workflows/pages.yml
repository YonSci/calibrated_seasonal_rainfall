# Publish the pre-built results site (site/, generated by scripts/build_site.py) to GitHub Pages, with the Astro pages of the
# new front end (web/, built here from site_data/; docs/49) under /next/. If the Astro build fails, the current site is still
# published (without /next/).
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', 'site_data/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the Astro pages into site/next
        id: astro
        continue-on-error: true
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          ASTRO_OUT=../site/next npm run build
      - name: Report a failed Astro build
        if: steps.astro.outcome == 'failure'
        run: echo "::warning::Astro build failed; publishing the current site without /next/."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
